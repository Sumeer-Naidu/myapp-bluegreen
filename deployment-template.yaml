apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-__COLOR__
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
      version: __COLOR__
  template:
    metadata:
      labels:
        app: myapp
        version: __COLOR__
    spec:
      containers:
      - name: myapp
        image: __IMAGE__
        ports:
        - containerPort: 3000
        env:
        - name: APP_COLOR
          value: __COLOR__
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 3
          periodSeconds: 5
